<!doctype html>
<html lang="en">
  <head>
    <!-- Libretto: mock backend (demo data only). Must run before the theme script and the app. -->
    <script src="/live/conductor/mock-backend.js"></script>
    <title>Canvas AI</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        let savedTheme = null;

        try {
          savedTheme = localStorage.getItem("canvas-ai-theme");
        } catch {
          // Fall back to the operating-system preference.
        }

        const systemPrefersDark =
          typeof window.matchMedia === "function" &&
          window.matchMedia("(prefers-color-scheme: dark)").matches;
        const isDark =
          savedTheme === "dark" ||
          (savedTheme !== "light" && systemPrefersDark);

        document.documentElement.classList.toggle("dark", isDark);
        document.documentElement.style.colorScheme = isDark ? "dark" : "light";
      })();
    </script>
    <script type="module" crossorigin src="/live/conductor/assets/index-CsFmEV1L.js"></script>
    <link rel="modulepreload" crossorigin href="/live/conductor/assets/jsx-runtime-n5LQ9ujS.js">
    <link rel="stylesheet" crossorigin href="/live/conductor/assets/index-CLWha3Lk.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
